; ═══════════════════════════════════════════════════
;  Bloomery — C++ Mold (Build Preset)
; ═══════════════════════════════════════════════════
;
;  Molds provide reusable defaults for build fields.
;  Tasks can reference mold values with <mold()> or
;  override them completely with their own fields.
;

[Bloomery]
Mold = c++

[Meta]
Name = C++
Version = 0.1
Author = k6303
Description = Default C++ compilation mold

[Definitions]
Compiler = g++
Standard = 17
Flags = -std=c++<var(standard)>
Files = <files ending (.cpp|.cc|.cxx|.c)>
Output = -o <input>.exe
