[meta]
name = "hello-cpp"
version = "0.1"
system = "c++"

[variables]
debug = true
debug_flags = "-g -O0"
output = { on = "platform", windows = "main.exe", default = "main" }

[plugins.command]
prefix = { on = "platform", windows = "cmd /c", default = "" }

[plugins.hooks.build]
post = "echo Build successful!"

[profiles.debug]
debug = true
debug_flags = "-g -O0"

[profiles.release]
debug = false
debug_flags = "-O2 -DNDEBUG"

# build/run come from the c++ mold; flags/headers below override it
[mold.tasks.build]
flags = "{mold.flags} {debug_flags}"
headers = { ending = [".h", ".hpp"] }

[mold.tasks.run]

[tasks.clean]
always_run = true
default = false
command = { on = "platform", windows = "cmd /c del /q", default = "rm -f" }
flags = "{output}"
