[Meta]
Name = hello-cpp
Version = 0.1
System = c++

[Variables]
compiler = g++
debug = true
output = hello<if(platform=windows)>.exe<end>

debug_flags = <if(var(debug))>-g -O0<else>-O2 -DNDEBUG<end>

[Plugins.Command]
Prefix = <if(platform=windows)>cmd /c<end>

[Plugins.Hooks]
PostBuild = echo Build successful!

[Profiles.debug]
debug = true

[Profiles.release]
debug = false

[Tasks]
build = Build
run = Run
clean = Clean

[Tasks.Build]
Command = {compiler}
Flags = -std=c++17 {debug_flags}
Files = <files ending (.cpp|.cc|.cxx)>
Headers = <files ending (.h|.hpp)>
Output = -o {output}

[Tasks.Run]
AlwaysRun = yes
Depends = Build
Command = {output}

[Tasks.Clean]
AlwaysRun = yes
Default = no
Command = <if(platform=windows)>cmd /c del /q<else>rm -f<end>
Flags = {output}
