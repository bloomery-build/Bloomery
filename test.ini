[Meta]
Name = test
Version = 0.1
Author = k6303
System = c++

[Variables]
compiler = g++
debug = true
output = main.exe

[Variables] ; Computed
debug_flags = <if(var(debug))>-g -O0<else>-O2<end>

[Plugins.Command]
Prefix = <if(platform=windows)>cmd /c<end>

[Plugins.Hooks]
OnBuildSuccess = echo Build successful!

[Profiles.debug]
debug = true
optimize = false

[Profiles.release]
debug = false
optimize = true

[Tasks]
build = Build
run = Run
clean = Clean

[Tasks.Build]
Command = {compiler}
Flags = -std=c++17 {debug_flags}
Files = <files ending (.cpp|.cc|.cxx|.c)>
Output = -o {output}

[Tasks.Run]
AlwaysRun = yes
Depends = Build
Command = {output}

[Tasks.Clean]
AlwaysRun = yes
Default = no
Command = cmd /c del /q
Flags = {output}
