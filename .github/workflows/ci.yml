name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.11", "3.13"]
        exclude:
          # 3.8 is unavailable on the arm64 macOS runners
          - os: macos-latest
            python-version: "3.8"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build the example project
        working-directory: examples/hello-cpp
        run: python -m bloomery project.toml build

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Verify bundled molds are packaged
        run: |
          python -m zipfile -l dist/*.whl | grep -E "molds/(c|c\+\+|rust|python)\.toml"
